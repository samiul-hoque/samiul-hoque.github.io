  .wire { stroke: #4A4843; fill: none; }
  .zone { fill: none; stroke: #B6B2A8; stroke-width: 0.7; stroke-dasharray: 4 4; }
  .pass { fill: #F3F1EC; stroke: #4A4843; stroke-width: 1; }
  .plate { stroke: #4A4843; stroke-width: 1.5; }
  .fet { fill: #DCE9F8; stroke: #3B7CC4; stroke-width: 1; }
  .term { fill: #DFEEE3; stroke: #3E8F5E; stroke-width: 1; }
  .dio { stroke: #D85A30; fill: none; }
  .node { fill: #4A4843; }
  .dnode { fill: #D85A30; }
</style>

