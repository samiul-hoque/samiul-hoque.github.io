<svg width="1360" height="1260" viewBox="0 0 680 630" xmlns="http://www.w3.org/2000/svg">
<title>Zoetrope strobe driver board, two channels, as built</title>
<desc>Power entry with bulk capacitors and bleed resistor, two identical LED channels each with paired ballast resistors, screw terminals, torch LED, 1N5822 clamp diode and IRLB8721 MOSFET, plus a shared gate bus with damping resistors and pulldown.</desc>
<style>
