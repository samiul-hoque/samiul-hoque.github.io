<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room Configurator</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- Bare-specifier map pointing at the vendored copy of three r160.
       Nothing here touches the network. -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <div id="stage">
    <div id="loader">
      <div class="bar"><span></span></div>
      <p class="status">Loading model…</p>
    </div>

    <div id="error" hidden>
      <h2>Can’t load the model</h2>
      <p class="message"></p>
    </div>
  </div>

  <aside id="panel">
    <header>
      <p class="eyebrow">Room configurator</p>
      <h1 id="room-name"></h1>
    </header>

    <div id="groups"></div>

    <footer>
      <p id="summary"></p>
      <button type="button" id="reset-view">Reset view</button>
      <p class="hint">Drag to orbit · scroll to zoom · right-drag to pan</p>
    </footer>
  </aside>

  <script type="module" src="js/main.js"></script>

</body>
</html>
