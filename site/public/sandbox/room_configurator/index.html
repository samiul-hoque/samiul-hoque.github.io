<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room Configurator</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- Bare-specifier map pointing at the vendored copy of three r160.
       Nothing here touches the network. -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <div id="stage">
    <div id="loader">
      <div class="bar"><span></span></div>
      <p class="status">Loading model…</p>
    </div>

    <div id="error" hidden>
      <h2>Can’t load the model</h2>
      <p class="message"></p>
    </div>
  </div>

  <aside id="panel">
    <header>
      <p class="eyebrow">Room configurator</p>
      <h1 id="room-name"></h1>
    </header>

    <section class="group" id="rooms">
      <h2 id="rooms-label">Room type</h2>
    </section>

    <div id="groups"></div>

    <section class="group" id="image-controls">
      <h2 id="image-controls-label">Image</h2>

      <label class="slider" for="brightness">
        <span class="slider-label">Brightness <output id="brightness-out">1.00</output></span>
        <input type="range" id="brightness" min="0.2" max="3" step="0.01" value="1">
      </label>

      <label class="slider" for="contrast">
        <span class="slider-label">Contrast <output id="contrast-out">0.00</output></span>
        <input type="range" id="contrast" min="-0.5" max="0.5" step="0.01" value="0">
      </label>

      <label class="toggle" for="ao">
        <input type="checkbox" id="ao" checked>
        <span>Ambient occlusion</span>
      </label>

      <button type="button" id="reset-image" class="link-btn">Reset image settings</button>
    </section>

    <footer>
      <p id="summary"></p>
      <button type="button" id="reset-view">Reset view</button>
      <p class="hint">Drag to orbit · scroll to zoom · right-drag to pan</p>
    </footer>
  </aside>

  <script type="module" src="js/main.js"></script>

</body>
</html>
